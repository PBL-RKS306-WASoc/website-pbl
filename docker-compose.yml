services:
  db:
    image: mariadb:10.4.32
    restart: "no"
    mem_limit: 768m
    cpus: 1.5
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in docker-local/.env}
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in docker-local/.env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in docker-local/.env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker-local/.env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-admin ping --user=root --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    restart: "no"
    user: "10001:10001"
    mem_limit: 512m
    cpus: 1.5
    command:
      - sh
      - -c
      - flask --app wsgi db upgrade && exec gunicorn --workers 2 --bind 0.0.0.0:8000 wsgi:app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5001}:8000"
    volumes:
      - .:/app
      - ./docker-local/.env.example:/app/.env:ro
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in docker-local/.env}
      DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      FLASK_DEBUG: "0"
      COOKIE_SECURE: "0"
      UPLOAD_FOLDER: uploads
      LOG_FILE: logs/app.log
      SOC_API_TOKEN: ""
      SOC_API_ALLOWED_IPS: 127.0.0.1
      SOC_API_DEFAULT_MINUTES: "30"
      SOC_API_MAX_MINUTES: "1440"
      MIDTRANS_SERVER_KEY: ""
      MIDTRANS_CLIENT_KEY: ""
      MIDTRANS_IS_PRODUCTION: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/auth/login', timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["tools"]
    restart: "no"
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

volumes:
  mariadb_data:
